<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>大气受热过程 · 小组拖拽建模</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', system-ui, sans-serif;
            background: #f0f7fc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* 顶部提示与按钮栏 */
        .top-bar {
            background: #d4e9f7;
            color: #1a3b4f;
            padding: 8px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(120, 160, 190, 0.15);
            flex-shrink: 0;
            z-index: 20;
            border-bottom: 2px solid #b8d8ec;
        }

        .task-tip {
            font-size: 1.1rem;
            background: #eaf6ff;
            padding: 6px 12px;
            border-radius: 40px;
            letter-spacing: 0.3px;
            font-weight: 600;
            flex: 2 1 400px;
            min-width: 200px;
            box-shadow: inset 0 1px 3px rgba(150, 190, 220, 0.15);
            color: #1a3b4f;
            border: 1px solid #c2ddef;
            line-height: 1.2;
        }

        .task-tip i {
            font-style: normal;
            margin-right: 8px;
            opacity: 0.85;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-end;
            flex: 1 0 auto;
        }

        .btn-group button {
            background: #ffffff;
            border: 2px solid #b8d8ec;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a3b4f;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
            box-shadow: 0 2px 4px rgba(150, 190, 220, 0.1);
            white-space: nowrap;
            line-height: 1;
        }

        .btn-group button:hover {
            background: #f5fbff;
            box-shadow: 0 4px 8px rgba(150, 190, 220, 0.25);
            transform: translateY(-1px);
        }

        .btn-group button.danger {
            background: #fef0f0;
            color: #a14b4b;
            border-color: #f2c9c9;
        }

        .btn-group button.primary {
            background: #7ec8e3;
            color: #ffffff;
            border-color: #5fb3d4;
        }

        .main-container {
            display: flex;
            flex: 1 1 auto;
            overflow: hidden;
            min-height: 0;
        }

        .canvas-wrapper {
            flex: 3;
            background: #e8f3fb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
            position: relative;
            min-width: 0;
        }

        .canvas-container {
            background: #f5fbff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(130, 170, 200, 0.2);
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            position: relative;
            overflow: hidden;
            border: 2px solid #c2ddef;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #mainCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: default;
            touch-action: none;
            object-fit: contain;
        }

        .library-panel {
            flex: 1;
            min-width: 260px;
            background: #ffffff;
            border-left: 2px solid #c2ddef;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: -4px 0 12px rgba(150, 190, 220, 0.1);
            z-index: 10;
        }

        .library-header {
            padding: 16px 12px;
            background: #e2f0fa;
            border-bottom: 2px solid #c2ddef;
            font-weight: 800;
            color: #1a3b4f;
            font-size: 1.4rem;
            text-align: center;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }

        .library-items {
            overflow-y: auto;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .lib-item {
            background: #f5fbff;
            border: 2px solid #d4e9f7;
            border-radius: 16px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: grab;
            transition: box-shadow 0.1s, border-color 0.1s;
            box-shadow: 0 2px 4px rgba(150, 190, 220, 0.05);
            user-select: none;
        }

        .lib-item:hover {
            border-color: #7ec8e3;
            box-shadow: 0 4px 8px rgba(150, 190, 220, 0.2);
            background: #ffffff;
        }

        .lib-preview {
            width: 80px;
            height: 44px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lib-label {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a3b4f;
            line-height: 1.3;
            word-break: break-word;
        }

        .library-items::-webkit-scrollbar {
            width: 8px;
        }

        .library-items::-webkit-scrollbar-track {
            background: #eaf6ff;
        }

        .library-items::-webkit-scrollbar-thumb {
            background: #b8d8ec;
            border-radius: 8px;
        }

        .hint-overlay {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(130, 170, 200, 0.3);
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            pointer-events: none;
            backdrop-filter: blur(2px);
            font-weight: 600;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- 顶部栏 -->
    <div class="top-bar">
        <div class="task-tip">
            <i>📘</i> 小组任务：拖拽辐射箭头放置到图中合适位置，调整箭头方向，搭建大气受热过程模型，允许摆放错误。
        </div>
        <div class="btn-group">
            <button id="toggleCloudBtn" title="显示/隐藏云层">☁️ 显示云层</button>
            <button id="resetCanvasBtn" class="danger" title="清空画布上的所有箭头">🔄 重置画布</button>
            <button id="screenshotBtn" class="primary" title="保存为PNG图片">📸 截图保存</button>
        </div>
    </div>

    <!-- 主体 -->
    <div class="main-container">
        <div class="canvas-wrapper">
            <div class="canvas-container" id="canvasContainer">
                <canvas id="mainCanvas" width="1000" height="625"></canvas>
                <div class="hint-overlay">点击箭头移动；选中后，拖动蓝色圈(↻)旋转，拖动黄色圈缩放</div>
            </div>
        </div>

        <div class="library-panel">
            <div class="library-header">📦 辐射箭头素材库</div>
            <div class="library-items" id="libraryItems"></div>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            const libraryItemsDiv = document.getElementById('libraryItems');

            const CANVAS_W = 1000;
            const CANVAS_H = 625;

            let cloudVisible = true;
            let arrows = [];
            let selectedArrowId = null;

            let interactionMode = null;
            let interactionArrowId = null;
            let startMouse = { x: 0, y: 0 };
            let startArrowState = null;

            // 素材库配置（已移除云层反射、大气射向宇宙的辐射）
            const LIBRARY_CONFIG = [
                { key: 'solar', label: '太阳短波辐射', color: '#FFC107', thickness: 12, length: 120, arrowHeadSize: 14 },
                { key: 'atmosAbsorbSolar', label: '大气吸收（太阳辐射）', color: '#FFC107', thickness: 7, length: 90, arrowHeadSize: 11 },
                { key: 'surfaceSolar', label: '到达地面太阳辐射', color: '#FFC107', thickness: 9, length: 110, arrowHeadSize: 12 },
                { key: 'groundLongwave', label: '地面长波辐射', color: '#FF7043', thickness: 9, length: 120, arrowHeadSize: 12 },
                { key: 'atmosAbsorbGround', label: '大气吸收地面辐射', color: '#FF7043', thickness: 8, length: 100, arrowHeadSize: 11 },
                { key: 'backRadiation', label: '大气逆辐射', color: '#FF7043', thickness: 7, length: 100, arrowHeadSize: 11 }
            ];

            // ---------- 辅助绘制固定箭头 ----------
            function drawFixedArrow(context, startX, startY, angle, length, thickness, color, text) {
                context.save();
                context.translate(startX, startY);
                context.rotate(angle);
                
                const headSize = thickness * 1.5;
                const lineLen = length - headSize;

                context.beginPath();
                context.moveTo(0, 0);
                context.lineTo(lineLen, 0);
                context.lineWidth = thickness;
                context.strokeStyle = color;
                context.lineCap = 'round';
                context.stroke();

                context.beginPath();
                context.moveTo(length, 0);
                context.lineTo(lineLen, -headSize * 0.7);
                context.lineTo(lineLen, headSize * 0.7);
                context.closePath();
                context.fillStyle = color;
                context.fill();
                context.restore();

                // 横向文字
                const midX = startX + Math.cos(angle) * length * 0.5;
                const midY = startY + Math.sin(angle) * length * 0.5;

                context.save();
                context.font = 'bold 20px "Segoe UI", sans-serif';
                context.fillStyle = '#1e2b3a';
                context.textAlign = 'center';
                context.textBaseline = 'bottom';
                context.shadowColor = 'rgba(255, 255, 255, 0.9)';
                context.shadowBlur = 6;
                context.fillText(text, midX, midY - 16);
                context.restore();
            }

            // ---------- 背景底图绘制 ----------
            function drawBaseMap(context) {
                context.clearRect(0, 0, CANVAS_W, CANVAS_H);

                // 1. 天空渐变
                const skyGrad = context.createLinearGradient(0, 0, 0, CANVAS_H);
                skyGrad.addColorStop(0, '#7ebdec');
                skyGrad.addColorStop(0.6, '#bce0f5');
                skyGrad.addColorStop(1, '#e6f4ff');
                context.fillStyle = skyGrad;
                context.fillRect(0, 0, CANVAS_W, CANVAS_H);

                // 2. 太阳
                context.save();
                const sunX = 140, sunY = 90;
                const sunGlow = context.createRadialGradient(sunX, sunY, 30, sunX, sunY, 90);
                sunGlow.addColorStop(0, 'rgba(255, 235, 100, 0.8)');
                sunGlow.addColorStop(1, 'rgba(255, 235, 100, 0)');
                context.fillStyle = sunGlow;
                context.beginPath();
                context.arc(sunX, sunY, 90, 0, Math.PI * 2);
                context.fill();

                context.beginPath();
                context.arc(sunX, sunY, 45, 0, Math.PI * 2);
                context.fillStyle = '#FFD700';
                context.fill();

                context.strokeStyle = '#FFD700';
                context.lineWidth = 4;
                for (let i = 0; i < 8; i++) {
                    const angle = (i * Math.PI) / 4;
                    context.beginPath();
                    context.moveTo(sunX + Math.cos(angle) * 55, sunY + Math.sin(angle) * 55);
                    context.lineTo(sunX + Math.cos(angle) * 75, sunY + Math.sin(angle) * 75);
                    context.stroke();
                }
                context.restore();

                // 3. 大气上界
                context.save();
                context.strokeStyle = '#ffffff';
                context.lineWidth = 3;
                context.setLineDash([15, 15]);
                context.beginPath();
                context.arc(500, 1100, 890, -2.17, -0.97);
                context.stroke();
                context.restore();

                context.save();
                context.font = 'bold 28px "Segoe UI", sans-serif';
                context.fillStyle = '#ffffff';
                context.shadowColor = 'rgba(0,0,0,0.2)';
                context.shadowBlur = 4;
                context.textAlign = 'center';
                context.textBaseline = 'bottom';
                context.fillText('大气上界', 500, 185);
                context.restore();

                // 4. 云层
                if (cloudVisible) {
                    drawCloud(context, 320, 300, 1.2);
                    drawCloud(context, 680, 260, 1.0);
                }

                // 5. 地球表面
                const earthCenterX = CANVAS_W / 2;
                const earthCenterY = 1100; 
                const earthRadius = 650;

                context.save();
                context.beginPath();
                context.arc(earthCenterX, earthCenterY, earthRadius + 25, 0, Math.PI * 2);
                context.fillStyle = 'rgba(150, 210, 255, 0.4)';
                context.fill();

                context.beginPath();
                context.arc(earthCenterX, earthCenterY, earthRadius, 0, Math.PI * 2);
                context.fillStyle = '#2980b9';
                context.fill();

                context.beginPath();
                context.arc(earthCenterX, earthCenterY, earthRadius - 15, 0, Math.PI * 2);
                context.fillStyle = '#7cb342';
                context.fill();
                context.restore();

                // 6. 绘制固定底图元素
                // 6.1 大气散射
                const dustX = 110, dustY = 420;
                
                context.save();
                context.fillStyle = 'rgba(120, 100, 80, 0.8)';
                context.beginPath();
                context.arc(dustX - 5, dustY, 3.5, 0, Math.PI * 2);
                context.arc(dustX + 5, dustY - 5, 3, 0, Math.PI * 2);
                context.arc(dustX + 2, dustY + 6, 2.5, 0, Math.PI * 2);
                context.fill();
                context.restore();

                context.save();
                context.strokeStyle = '#FFC107';
                context.fillStyle = '#FFC107';
                context.lineWidth = 5;
                const scatterLen = 35;
                for (let i = 0; i < 8; i++) {
                    const angle = i * Math.PI / 4;
                    const startX = dustX + Math.cos(angle) * 10;
                    const startY = dustY + Math.sin(angle) * 10;
                    const endX = dustX + Math.cos(angle) * (10 + scatterLen);
                    const endY = dustY + Math.sin(angle) * (10 + scatterLen);
                    
                    context.beginPath();
                    context.moveTo(startX, startY);
                    context.lineTo(endX, endY);
                    context.stroke();
                    
                    context.save();
                    context.translate(endX, endY);
                    context.rotate(angle);
                    context.beginPath();
                    context.moveTo(0, 0);
                    context.lineTo(-8, -5);
                    context.lineTo(-8, 5);
                    context.closePath();
                    context.fill();
                    context.restore();
                }
                context.font = 'bold 20px "Segoe UI", sans-serif';
                context.fillStyle = '#1e2b3a';
                context.textAlign = 'center';
                context.textBaseline = 'bottom';
                context.shadowColor = 'rgba(255, 255, 255, 0.9)';
                context.shadowBlur = 6;
                context.fillText('大气散射', dustX, dustY - 55);
                context.restore();

                // 6.2 地面反射
                drawFixedArrow(context, 110, 580, -Math.PI * 0.65, 80, 4, '#FFC107', '地面反射');

                // 6.3 射向宇宙的地面辐射
                drawFixedArrow(context, 480, 460, -Math.PI / 2, 300, 4, '#FF7043', '射向宇宙的地面辐射');

                // 6.4 云层反射（固定在底图上）
                drawFixedArrow(context, 360, 280, -Math.PI / 2.8, 100, 9, '#FFC107', '云层反射（太阳辐射）');

                // 6.5 大气射向宇宙的辐射（调整位置：放在右侧云朵上方）
                // 右侧云朵中心大致在 (680, 260)，云朵顶部约在 y=230 左右
                drawFixedArrow(context, 680, 230, -Math.PI / 2, 150, 7, '#FF7043', '射向宇宙的大气辐射');
            }

            // 云朵绘制
            function drawCloud(context, x, y, scale) {
                context.save();
                context.translate(x, y);
                context.scale(scale, scale);
                context.fillStyle = '#ffffff';
                context.globalAlpha = 0.95;
                context.shadowColor = 'rgba(255,255,255,0.9)';
                context.shadowBlur = 15;
                
                context.beginPath();
                context.arc(-30, 10, 25, 0, Math.PI * 2);
                context.arc(0, -10, 35, 0, Math.PI * 2);
                context.arc(35, 0, 28, 0, Math.PI * 2);
                context.arc(60, 10, 22, 0, Math.PI * 2);
                context.arc(15, 15, 30, 0, Math.PI * 2);
                context.fill();
                context.restore();
            }

            // ---------- 动态绘制可拖拽箭头 ----------
            function drawArrows() {
                for (let arrow of arrows) {
                    drawSingleArrow(arrow);
                }
                if (selectedArrowId !== null) {
                    const arrow = arrows.find(a => a.id === selectedArrowId);
                    if (arrow) drawSelectionHandles(arrow);
                }
            }

            function drawSingleArrow(arrow) {
                const { x, y, angle, scale, length, thickness, color, label, arrowHeadSize } = arrow;
                const currentLength = length * scale;
                const currentThickness = thickness * scale;
                const headSize = arrowHeadSize * scale;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(currentLength - headSize, 0);
                ctx.lineWidth = currentThickness;
                ctx.strokeStyle = color;
                ctx.lineCap = 'round';
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(currentLength, 0);
                ctx.lineTo(currentLength - headSize, -headSize * 0.7);
                ctx.lineTo(currentLength - headSize, headSize * 0.7);
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();

                ctx.font = `bold ${Math.max(14, 22 * scale)}px 'Segoe UI', 'Roboto', sans-serif`;
                ctx.fillStyle = '#1e2b3a';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
                ctx.shadowBlur = 6;
                
                const labelX = currentLength * 0.5;
                const labelY = -currentThickness * 0.8 - 8;
                ctx.fillText(label, labelX, labelY);

                ctx.restore();
            }

            function drawSelectionHandles(arrow) {
                const { x, y, angle, scale, length } = arrow;
                const currentLength = length * scale;
                const handleRadius = 16;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);

                // 1. 缩放手柄（头部）
                ctx.beginPath();
                ctx.arc(currentLength + 24, 0, handleRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#f0b400';
                ctx.shadowColor = '#00000040';
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(currentLength + 16, -8);
                ctx.lineTo(currentLength + 32, 8);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();

                // 2. 旋转手柄（尾部外侧）
                const rotHandleDist = -40;
                ctx.beginPath();
                ctx.arc(rotHandleDist, 0, handleRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#7ec8e3';
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.font = 'bold 24px sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('↻', rotHandleDist, 2);

                ctx.restore();
            }

            function render() {
                drawBaseMap(ctx);
                drawArrows();
            }

            // ---------- 构建素材库 ----------
            function buildLibrary() {
                libraryItemsDiv.innerHTML = '';
                LIBRARY_CONFIG.forEach((config, index) => {
                    const item = document.createElement('div');
                    item.className = 'lib-item';
                    item.draggable = true;
                    item.dataset.index = index;

                    const previewDiv = document.createElement('div');
                    previewDiv.className = 'lib-preview';
                    const prevCanvas = document.createElement('canvas');
                    prevCanvas.width = 80;
                    prevCanvas.height = 44;
                    prevCanvas.style.width = '100%';
                    prevCanvas.style.height = '100%';
                    const pCtx = prevCanvas.getContext('2d');

                    pCtx.clearRect(0, 0, 80, 44);
                    pCtx.save();
                    pCtx.translate(10, 24);
                    const previewThickness = Math.max(3, config.thickness * 0.6);
                    const previewLength = 56;
                    const headSize = Math.max(8, config.arrowHeadSize * 0.6);
                    pCtx.beginPath();
                    pCtx.moveTo(0, 0);
                    pCtx.lineTo(previewLength - headSize, 0);
                    pCtx.lineWidth = previewThickness;
                    pCtx.strokeStyle = config.color;
                    pCtx.lineCap = 'round';
                    pCtx.stroke();
                    pCtx.beginPath();
                    pCtx.moveTo(previewLength, 0);
                    pCtx.lineTo(previewLength - headSize, -headSize * 0.7);
                    pCtx.lineTo(previewLength - headSize, headSize * 0.7);
                    pCtx.closePath();
                    pCtx.fillStyle = config.color;
                    pCtx.fill();
                    pCtx.restore();

                    previewDiv.appendChild(prevCanvas);

                    const labelSpan = document.createElement('span');
                    labelSpan.className = 'lib-label';
                    labelSpan.textContent = config.label;

                    item.appendChild(previewDiv);
                    item.appendChild(labelSpan);

                    item.addEventListener('dragstart', (e) => {
                        e.dataTransfer.setData('text/plain', index);
                        e.dataTransfer.effectAllowed = 'copy';
                        item.style.opacity = '0.5';
                    });

                    item.addEventListener('dragend', (e) => {
                        item.style.opacity = '1';
                    });

                    libraryItemsDiv.appendChild(item);
                });
            }

            // ---------- 画布放置逻辑 ----------
            canvas.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'copy';
            });

            canvas.addEventListener('drop', (e) => {
                e.preventDefault();
                const indexStr = e.dataTransfer.getData('text/plain');
                if (indexStr === '') return;
                const idx = parseInt(indexStr, 10);
                if (isNaN(idx) || idx < 0 || idx >= LIBRARY_CONFIG.length) return;

                const coords = getCanvasCoords(e);

                const config = LIBRARY_CONFIG[idx];
                const newArrow = {
                    id: Date.now() + Math.random() * 10000,
                    type: config.key,
                    x: coords.x,
                    y: coords.y,
                    angle: 0,
                    scale: 1.0,
                    length: config.length,
                    thickness: config.thickness,
                    color: config.color,
                    label: config.label,
                    arrowHeadSize: config.arrowHeadSize
                };
                arrows.push(newArrow);
                selectedArrowId = newArrow.id;
                render();
            });

            // ---------- 核心：修复坐标偏移 ----------
            function getCanvasCoords(e) {
                const rect = canvas.getBoundingClientRect();
                
                const canvasRatio = CANVAS_W / CANVAS_H;
                const rectRatio = rect.width / rect.height;
                
                let renderWidth, renderHeight, offsetX, offsetY;
                
                if (rectRatio > canvasRatio) {
                    renderHeight = rect.height;
                    renderWidth = renderHeight * canvasRatio;
                    offsetX = (rect.width - renderWidth) / 2;
                    offsetY = 0;
                } else {
                    renderWidth = rect.width;
                    renderHeight = renderWidth / canvasRatio;
                    offsetX = 0;
                    offsetY = (rect.height - renderHeight) / 2;
                }

                let clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                const relativeX = clientX - rect.left - offsetX;
                const relativeY = clientY - rect.top - offsetY;

                return {
                    x: (relativeX / renderWidth) * CANVAS_W,
                    y: (relativeY / renderHeight) * CANVAS_H
                };
            }

            // ---------- 交互核心逻辑 ----------
            function hitTestArrow(px, py) {
                for (let i = arrows.length - 1; i >= 0; i--) {
                    const arrow = arrows[i];
                    const dx = px - arrow.x;
                    const dy = py - arrow.y;
                    const rad = -arrow.angle;
                    const cos = Math.cos(rad);
                    const sin = Math.sin(rad);
                    const localX = dx * cos - dy * sin;
                    const localY = dx * sin + dy * cos;
                    
                    const currentLength = arrow.length * arrow.scale;
                    const currentThickness = arrow.thickness * arrow.scale;
                    
                    const pad = 30; 
                    if (localX >= -pad && localX <= currentLength + pad && Math.abs(localY) <= currentThickness * 2 + pad) {
                        return arrow;
                    }
                }
                return null;
            }

            function hitTestRotateHandle(px, py, arrow) {
                if (!arrow) return false;
                const dx = px - arrow.x;
                const dy = py - arrow.y;
                const rad = -arrow.angle;
                const cos = Math.cos(rad);
                const sin = Math.sin(rad);
                const localX = dx * cos - dy * sin;
                const localY = dx * sin + dy * cos;
                const dist = Math.hypot(localX - (-40), localY - 0);
                return dist <= 45; 
            }

            function hitTestScaleHandle(px, py, arrow) {
                if (!arrow) return false;
                const currentLength = arrow.length * arrow.scale;
                const dx = px - arrow.x;
                const dy = py - arrow.y;
                const rad = -arrow.angle;
                const cos = Math.cos(rad);
                const sin = Math.sin(rad);
                const localX = dx * cos - dy * sin;
                const localY = dx * sin + dy * cos;
                const dist = Math.hypot(localX - (currentLength + 24), localY - 0);
                return dist <= 45; 
            }

            function onPointerDown(e) {
                e.preventDefault();
                const { x, y } = getCanvasCoords(e);

                if (selectedArrowId !== null) {
                    const selectedArrow = arrows.find(a => a.id === selectedArrowId);
                    if (selectedArrow) {
                        if (hitTestRotateHandle(x, y, selectedArrow)) {
                            interactionMode = 'rotate';
                            interactionArrowId = selectedArrow.id;
                            startMouse = { x, y };
                            const mouseAngleStart = Math.atan2(y - selectedArrow.y, x - selectedArrow.x);
                            startArrowState = { angle: selectedArrow.angle, mouseAngle: mouseAngleStart };
                            return;
                        }
                        if (hitTestScaleHandle(x, y, selectedArrow)) {
                            interactionMode = 'scale';
                            interactionArrowId = selectedArrow.id;
                            startMouse = { x, y };
                            startArrowState = { scale: selectedArrow.scale };
                            return;
                        }
                    }
                }

                const hitArrow = hitTestArrow(x, y);
                if (hitArrow) {
                    selectedArrowId = hitArrow.id;
                    interactionMode = 'move';
                    interactionArrowId = hitArrow.id;
                    startMouse = { x, y };
                    startArrowState = { x: hitArrow.x, y: hitArrow.y };
                    render();
                } else {
                    selectedArrowId = null;
                    render();
                }
            }

            function onPointerMove(e) {
                if (interactionMode === null) return;
                e.preventDefault();

                const { x, y } = getCanvasCoords(e);
                const arrow = arrows.find(a => a.id === interactionArrowId);
                if (!arrow) return;

                if (interactionMode === 'move') {
                    const dx = x - startMouse.x;
                    const dy = y - startMouse.y;
                    arrow.x = startArrowState.x + dx;
                    arrow.y = startArrowState.y + dy;
                } else if (interactionMode === 'rotate') {
                    const mouseAngleCurrent = Math.atan2(y - arrow.y, x - arrow.x);
                    let angleDiff = mouseAngleCurrent - startArrowState.mouseAngle;
                    if (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    if (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    arrow.angle = startArrowState.angle + angleDiff;
                } else if (interactionMode === 'scale') {
                    const dx = x - arrow.x;
                    const dy = y - arrow.y;
                    const rad = arrow.angle;
                    const proj = dx * Math.cos(rad) + dy * Math.sin(rad);
                    let newScale = proj / arrow.length;
                    arrow.scale = Math.min(3, Math.max(0.3, newScale));
                }
                render();
            }

            function onPointerUp(e) {
                if (interactionMode !== null) {
                    interactionMode = null;
                    interactionArrowId = null;
                    startArrowState = null;
                    render();
                }
            }

            canvas.addEventListener('mousedown', onPointerDown);
            canvas.addEventListener('mousemove', onPointerMove);
            canvas.addEventListener('mouseup', onPointerUp);
            canvas.addEventListener('mouseleave', onPointerUp);

            canvas.addEventListener('touchstart', onPointerDown, { passive: false });
            canvas.addEventListener('touchmove', onPointerMove, { passive: false });
            canvas.addEventListener('touchend', onPointerUp);
            canvas.addEventListener('touchcancel', onPointerUp);

            window.addEventListener('keydown', (e) => {
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    if (selectedArrowId !== null) {
                        e.preventDefault();
                        arrows = arrows.filter(a => a.id !== selectedArrowId);
                        selectedArrowId = null;
                        render();
                    }
                }
            });

            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            // ---------- 按钮 ----------
            const toggleCloudBtn = document.getElementById('toggleCloudBtn');
            toggleCloudBtn.addEventListener('click', () => {
                cloudVisible = !cloudVisible;
                toggleCloudBtn.innerHTML = cloudVisible ? '☁️ 隐藏云层' : '☁️ 显示云层';
                render();
            });

            const resetBtn = document.getElementById('resetCanvasBtn');
            resetBtn.addEventListener('click', () => {
                if (arrows.length === 0) return;
                if (confirm('确定清空画布上的所有箭头吗？')) {
                    arrows = [];
                    selectedArrowId = null;
                    render();
                }
            });

            const screenshotBtn = document.getElementById('screenshotBtn');
            screenshotBtn.addEventListener('click', () => {
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = CANVAS_W;
                exportCanvas.height = CANVAS_H;
                const exportCtx = exportCanvas.getContext('2d');

                drawBaseMap(exportCtx);

                for (let arrow of arrows) {
                    const { x, y, angle, scale, length, thickness, color, label, arrowHeadSize } = arrow;
                    const currentLength = length * scale;
                    const currentThickness = thickness * scale;
                    const headSize = arrowHeadSize * scale;

                    exportCtx.save();
                    exportCtx.translate(x, y);
                    exportCtx.rotate(angle);

                    exportCtx.beginPath();
                    exportCtx.moveTo(0, 0);
                    exportCtx.lineTo(currentLength - headSize, 0);
                    exportCtx.lineWidth = currentThickness;
                    exportCtx.strokeStyle = color;
                    exportCtx.lineCap = 'round';
                    exportCtx.stroke();

                    exportCtx.beginPath();
                    exportCtx.moveTo(currentLength, 0);
                    exportCtx.lineTo(currentLength - headSize, -headSize * 0.7);
                    exportCtx.lineTo(currentLength - headSize, headSize * 0.7);
                    exportCtx.closePath();
                    exportCtx.fillStyle = color;
                    exportCtx.fill();

                    exportCtx.font = `bold ${Math.max(14, 22 * scale)}px 'Segoe UI', 'Roboto', sans-serif`;
                    exportCtx.fillStyle = '#1e2b3a';
                    exportCtx.textAlign = 'center';
                    exportCtx.textBaseline = 'bottom';
                    exportCtx.shadowColor = 'rgba(255, 255, 255, 0.9)';
                    exportCtx.shadowBlur = 6;
                    
                    const labelX = currentLength * 0.5;
                    const labelY = -currentThickness * 0.8 - 8;
                    exportCtx.fillText(label, labelX, labelY);

                    exportCtx.restore();
                }

                const link = document.createElement('a');
                link.download = `大气受热过程_${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.png`;
                link.href = exportCanvas.toDataURL('image/png');
                link.click();
            });

            function init() {
                buildLibrary();
                toggleCloudBtn.innerHTML = cloudVisible ? '☁️ 隐藏云层' : '☁️ 显示云层';
                render();
            }

            init();
        })();
    </script>
</body>
</html>
